subject: APRA Connect (regulatory data-lodgement platform)
note: >-
  APRA publishes dated release notes for the APRA Connect system itself. There is no
  API version to change, so the change surface is the reporting collections: schemas,
  validation rules, enumerations and form layouts. Substantive change detail is
  carried in the per-industry "Artefacts Change Log" spreadsheets on the taxonomy
  artefacts page — see data-model/apra-reporting-taxonomy.yml.
versioning:
  scheme: dated-release
  api_version: none
  collection_versioning: >-
    Each reporting collection is versioned individually inside the taxonomy artefacts
    (e.g. "APRA-GRS 320.0 Liability Roll Forwards-V10"), and superseded versions are
    replaced when a new artefact pack is published.
  change_log_files: https://www.apra.gov.au/apra-portals/apra-connect/apra-connect-taxonomy-artefacts
  cadence: >-
    Irregular; releases observed roughly every 2–3 months. Legacy D2A validation and
    derivation rules were refreshed two weeks before the end of each quarter.
