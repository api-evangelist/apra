  evidence: https://www.apra.gov.au/.well-known/security.txt returns 200 with Contact,
    Policy, Preferred-Languages and Canonical fields
- id: rss-2.0
  conforms: true
  evidence: https://www.apra.gov.au/rss.xml is a valid RSS 2.0 news and publications
    feed
- id: sitemaps-0.9
  conforms: true
  evidence: https://www.apra.gov.au/sitemap.xml is a sitemapindex (Drupal Simple XML
    Sitemap), 2 pages / 3,451 URLs
- id: xml-schema-xsd
  conforms: true
  evidence: 107 XSD files published across five APRA Connect taxonomy packs, explicitly
    intended to enable XML validation and third-party software integration — see
    data-model/apra-reporting-taxonomy.yml
- id: xbrl
  conforms: true
  evidence: XBRL is an accepted APRA Connect submission format alongside manual entry,
    XML and Excel
- id: au-gov-digital-id-system
  conforms: true
  evidence: APRA Connect is integrated with the Australian Government Digital ID System
