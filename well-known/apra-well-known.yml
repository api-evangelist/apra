  reachable: true
- host: https://connect.apra.gov.au
  reachable: true
  note: F5 BIG-IP WAF rejects anonymous requests with a 200 HTML page.
- host: https://connect-test.apra.gov.au
  reachable: true
  note: APRA Connect test environment; same WAF/login wall.
- host: https://api.apra.gov.au
  reachable: false
  note: DNS A record 124.47.155.12 resolves, but TCP/443 and TCP/80 both time out.
    No service is published on this name as of 2026-07-25.
