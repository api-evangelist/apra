source: live probes of every APRA host in apis.yml
note: >-
  APRA publishes exactly one /.well-known/ document — an RFC 9116 security.txt on
  the corporate site. The APRA Connect hosts sit behind an F5 WAF that answers every
  path with an HTTP 200 "Request Rejected" HTML page, so a 200 from connect.apra.gov.au
  is NOT a discovery document; each of those probes is recorded below as a WAF false
  positive with parsed:false. api.apra.gov.au has an A record (124.47.155.12) but
  TCP/443 is filtered — nothing answers.
hosts:
