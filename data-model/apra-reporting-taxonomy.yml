note: >-
  APRA publishes no OpenAPI, so there is no spec to derive an entity graph from. What
  APRA does publish is a real machine-readable data model — the APRA Connect reporting
  taxonomy: one XSD per collection group plus a reporting-taxonomy workbook per
  reporting standard (schemas, elements, data types, enumerations, form layouts) and a
  per-industry validation-rules workbook. This artifact is the verified inventory of
  that corpus: every pack below was downloaded on 2026-07-25 and its contents listed,
  so the counts and file names are observed, not claimed.
model:
  kind: XSD / XBRL reporting taxonomy
  units: reporting collections (one per reporting standard, versioned individually)
  identifier_convention: >-
    Collections are named for their reporting standard — ARS (authorised
    deposit-taking institutions), GRS (general insurance), LRS (life insurance and
    friendly societies), HRS (private health insurance), SRS (superannuation) — with a
    numeric form id and a version suffix, e.g. "APRA-GRS 320.0 Liability Roll
    Forwards-V10". A ".G" suffix marks the group/consolidated variant of a collection.
  xsd_naming: >-
    XSD file names use the industry prefix plus an underscore-escaped short code,
    e.g. GI_uL1_uLIABROLLFWDS.xsd, LI_uSTATFINPOS.xsd, SUP_uMEMAC.xsd. "_u" is the
    escape APRA uses for an underscore in the generated name.
  submission_formats: [manual entry, XML, XBRL, Excel]
  ad_hoc_upload_limit: 30 MB
  validation:
    rules_workbook_per_pack: true
    change_log_per_pack: true
    change_log_sections: [Schemas, Amended validation rules, Rule restrictions, Release
        notes]
    legacy_d2a_rules:
      mandatory: Data with mathematical errors, discrepancies or factual inconsistencies
        — must be corrected before submission
      confirmation: Data indicating reporting errors or requiring explanation — must
        be corrected or explained
      url: https://www.apra.gov.au/apra-portals/direct-apra/validation-and-derivation-rules
  derivation_rules:
    description: Formulae that automatically calculate attribute values from other
      attributes
    url: https://www.apra.gov.au/apra-portals/direct-apra/validation-and-derivation-rules
