  sunset_header: false
  deprecation_header: false
  events:
  - name: Direct to APRA (D2A) legacy submission client
    status: decommissioned
    date_offline: '2026-03-20'
    announced: '2026-03-27'
    reason: >-
      Security vulnerabilities identified through a routine penetration test on
      19 March 2026. APRA took the client offline for entity access the following day
      and accelerated the migration of all data collections to APRA Connect.
    replacement: APRA Connect (https://connect.apra.gov.au)
    consumer_action: >-
      Uninstall the D2A client (default install path C:\D2A); review internal system
      and data security measures; contact dataanalytics@apra.gov.au for interim
      secure submission instructions (XML or XBRL preferred) until the collection is
      migrated.
    url: https://www.apra.gov.au/news-and-publications/direct-apra-security-update-and-accelerated-decommission
  migration_programme:
    name: D2A to APRA Connect collection migration
    status: in-progress
    docs: https://www.apra.gov.au/apra-portals/apra-connect/migrating-d2a-collections-support-material
    faq: https://www.apra.gov.au/frequently-asked-questions-d2a-apra-connect-migration
    note: >-
      Collections migrate industry by industry; each migration lands first in the
      APRA Connect test environment and is announced in the release notes (for
      example EFS collections in February 2026 and market risk collections in
      November 2025, both test-environment first).
  legacy_rules:
