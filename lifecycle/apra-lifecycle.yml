source: https://www.apra.gov.au/apra-portals/apra-connect
note: >-
  APRA ships no API, so there is no API version, no Sunset/Deprecation header support
  and no SLA to record. What APRA does run a lifecycle for is its data-lodgement
  channel and its reporting collections — and that lifecycle is documented, dated and
  currently mid-migration. This artifact records that real lifecycle rather than an
  API one.
versioning:
  scheme: dated-release
  api_version: none
  current: APRA Connect (production), APRA Connect test (parallel environment)
  docs: https://www.apra.gov.au/apra-portals/apra-connect/apra-connect-release-notes
  collection_versioning: >-
    Individual reporting collections carry their own version suffix in the taxonomy
    artefacts (for example "APRA-GRS 320.0 Liability Roll Forwards-V10"); a new
    artefact pack supersedes the previous one for that industry.
deprecation:
