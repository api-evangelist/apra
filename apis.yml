name: APRA
kind: company
description: The Australian Prudential Regulation Authority (APRA) is the Commonwealth
  statutory authority that prudentially supervises Australia's banks, credit unions,
  building societies, general insurers, life insurers, private health insurers, reinsurers
  and most of the superannuation industry, protecting depositors, policyholders and
  fund members under the Financial Sector (Collection of Data) Act 2001 and the Insurance
  Act 1973. Across insurance it authorises and registers general insurers, life insurers
  and friendly societies, and private health insurers; publishes prudential standards
  and practice guides; maintains public registers of authorised institutions; and
  runs the quarterly general, life and private health insurance performance statistics
  plus the National Claims and Policies Database. Its API posture is honestly none
  as of July 2026 — APRA operates no developer portal, publishes no OpenAPI or Swagger
  definition, and offers no self-serve API. Regulated entities lodge data through APRA
  Connect (connect.apra.gov.au), a browser-only portal gated behind the Australian
  Government Digital ID System (myID plus Relationship Authorisation Manager); APRA's
  own technical specification page lists the API Technical Specification as "to be
  provided when this functionality is available," so machine-to-machine submission
  remains a roadmap item and not a shipped surface. What APRA does publish machine-readably
  is a standards corpus rather than an API — per-industry APRA Connect taxonomy artefacts
  (XSD schemas, reporting taxonomy and validation rule workbooks) for General Insurance,
  Private Health Insurance and Life Insurance — while statistics ship as XLSX and Power
  BI, and the public insurer registers are HTML tables with no bulk export. No ACORD,
  AL3 or NGDS reference appears anywhere on apra.gov.au; APRA's reporting data model
  is its own XBRL/XSD taxonomy, not the insurance industry's ACORD standards.
