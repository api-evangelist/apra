    url: ''
    confirmed: false
    classification: none — no developer portal exists in any form
    probes:
    - url: https://developer.apra.gov.au
      status: 000
      note: DNS does not resolve
    - url: https://developers.apra.gov.au
      status: 000
      note: DNS does not resolve
    - url: https://docs.apra.gov.au
      status: 000
      note: DNS does not resolve
    - url: https://api.apra.gov.au
      status: 000
      note: DNS does not resolve
    - url: https://www.apra.gov.au/developers
      status: 404
    - url: https://www.apra.gov.au/api
      status: 404
    - url: https://www.apra.gov.au/developer
      status: 404
    - url: https://www.apra.gov.au/partners
      status: 404
    - url: https://www.apra.gov.au/integrations
      status: 404
    - url: https://www.apra.gov.au/
      status: 200
      note: Public corporate/regulatory website (Drupal 11). No developer section.
    - url: https://www.apra.gov.au/apra-portals/apra-connect
      status: 200
      note: APRA Connect landing page — describes a login-gated lodgement portal,
        classified as (b) a partner/entity login wall, not a developer portal.
    - url: https://connect.apra.gov.au
      status: 200
      note: F5 WAF returns an HTTP 200 "Request Rejected" HTML page to anonymous
        clients. This is a login wall, NOT a live API surface.
