actions:
  apisYmlCreated: true
  apisListed: 0
  openapiDirectory: omitted — no real specification was found to save
  reason: |
    APRA is correctly recorded as a documentation-and-standards-first market
    body with an empty apis[] array. Recording "no public API surface;
    entity-gated lodgement portal only; reporting taxonomy published as XSD/XBRL
    rather than ACORD" is the accurate finding, and inventing an API family or
    classifying the myID/RAM login wall as a developer portal would have been
    fabrication.
