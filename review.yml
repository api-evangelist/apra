aid: apra
name: APRA
review:
  question: Does APRA publish a public, self-serve developer portal or documented API
    for insurance supervision, registers, or statistics?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Australia
  tier: market-infrastructure
  organizationType: prudential regulator (Commonwealth statutory authority)
findings:
  summary: |
    APRA — the Australian Prudential Regulation Authority — publishes NO public
    developer portal and NO API of any kind as of 2026-07-25. Every conventional
    developer host was probed and none resolves: developer.apra.gov.au,
    developers.apra.gov.au, docs.apra.gov.au and api.apra.gov.au all fail DNS
    (curl exit / HTTP 000), and apra.gov.au/developers, /api, /developer,
    /partners and /integrations all return HTTP 404. The only integration
    surface is APRA Connect, the regulatory data-lodgement portal, which is a
    browser application gated behind the Australian Government Digital ID System
    (myID for identity plus Relationship Authorisation Manager for the
    entity relationship). APRA's own APRA Connect information security and
    technical specifications page settles the question in APRA's own words: the
    API Technical Specification is listed as "to be provided when this
    functionality is available" — machine-to-machine submission is a roadmap
    item, not a shipped surface. The RegTech access page confirms the same:
    RegTechs get test-environment PORTAL access by signed deed after emailing
    dataanalytics@apra.gov.au, and the page makes no mention of API access,
    API documentation, or API-based integration.

    What APRA does publish machine-readably is a STANDARDS corpus, not an API.
    The APRA Connect taxonomy artefacts page distributes per-industry reporting
    taxonomy packages containing XSD schemas (explicitly "to enable XML
    validation and third-party software integration"), reporting taxonomy
    workbooks (schemas, elements, data types, enumerations, form layouts) and
    validation rule spreadsheets — covering General Insurance (May 2026, 3.42 MB
    ZIP), Private Health Insurance (February 2026, 1.30 MB ZIP) and Life
    Insurance (February 2026, 1.84 MB ZIP), alongside ADI and Superannuation.
    Accepted submission formats are manual entry, XML, XBRL and Excel. This
    XSD/XBRL data model is the contract APRA governs against, and it is the
    correct thing to record for a regulator in place of an OpenAPI.

    Statistics and registers are equally API-free. The quarterly general, life
    and private health insurance performance statistics ship as XLSX downloads
    plus an embedded Power BI dashboard — no CSV API, no bulk endpoint. The
    National Claims and Policies Database (professional indemnity and public and
    product liability policy/claim data) is published the same way. The public
    registers of authorised general insurers, registered life insurers and
    friendly societies, and registered private health insurers are plain HTML
    tables with per-entity condition PDFs and no bulk export. A CKAN query
    against data.gov.au found no APRA publisher organisation and zero datasets
    under an APRA organisation slug, so there is not even a third-party
    machine-readable redistribution channel.

    Market-seam context: Australia has the legal machinery for open insurance
    and no live obligation. The Consumer Data Right opened banking and energy
    and was designated to extend to general insurance, then deferred and
    de-prioritised — so the CDR seam that made Australian banking legible stops
    before insurance, and APRA, which is a prudential supervisor rather than a
    CDR data-standards body, has no forcing function pushing it toward a public
    API. Contrast the UK FCA, whose Financial Services Register API is real and
    documented; APRA's equivalent register is an HTML page.
