      status: 200
      note: APRA Connect test environment; same deed-gated portal access.
  openapi:
    harvested: false
    specsCount: 0
    note: No OpenAPI, Swagger, RAML or API Blueprint definition is published anywhere
      on apra.gov.au or connect.apra.gov.au. Every spec probe was checked and rejected.
    probes:
    - url: https://www.apra.gov.au/openapi.json
      status: 404
    - url: https://www.apra.gov.au/swagger.json
      status: 404
    - url: https://connect.apra.gov.au/openapi.json
      status: 200
      parsed: false
      note: FALSE POSITIVE — body is the F5 WAF "Request Rejected" HTML page, not a
        specification.
    - url: https://connect.apra.gov.au/swagger.json
      status: 200
      parsed: false
      note: FALSE POSITIVE — WAF rejection HTML.
    - url: https://connect.apra.gov.au/api-docs
      status: 200
      parsed: false
      note: FALSE POSITIVE — WAF rejection HTML.
  acord:
    posture: no ACORD reference found — APRA reports on its own XBRL/XSD taxonomy
    detail: |
      A site search of apra.gov.au for "ACORD" returns no matching results, and no
      APRA Connect page, prudential standard, taxonomy artefact page or statistical
      publication references ACORD, AL3, ACORD XML, NGDS or ACORD certification.
      This is expected: APRA is a prudential regulator collecting solvency, capital
      and performance returns, not a policy/claims transaction hub, so its data
      standard is its own APRA Connect reporting taxonomy expressed as XSD and XBRL
      rather than the insurance industry's ACORD messaging standards. IVANS, agency
      download, Applied Epic and Vertafore AMS360 are US agency-management concerns
      and are absent, as expected in the Australian market.
    substituteStandard:
      name: APRA Connect reporting taxonomy (XSD + XBRL data point model)
      url: https://www.apra.gov.au/apra-portals/apra-connect/apra-connect-taxonomy-artefacts
      artifacts:
      - Reporting Taxonomy workbooks (XLSX) — schemas, elements, data types, enumerations,
        form layouts, validation rules
      - Validation Rules spreadsheets (XLSX) — error and warning rules with business
        descriptions
      - XSD files — XML Schema Definition for validation and third-party software integration
      - Playback spreadsheets (XLSX) — transition tooling for selected collections
      insuranceCollections:
      - General Insurance taxonomy artefacts (May 2026) — playback for GRS 114.0,
        GRS 115.0.G, GRS 115.1.G
      - Private Health Insurance taxonomy artefacts (February 2026) — playback for
        HRS 114.0, HRS 115.0
      - Life Insurance taxonomy artefacts (February 2026) — playback for LRS 114.0,
        LRS 200.0
  insuranceVerbs:
    quote: false
    bind: false
    issue: false
    fnol: false
    note: None of the four insurance API verbs are exposed, and none would be expected.
      APRA is a supervisor, not a carrier, broker or MGA — it never quotes, binds,
      issues or takes first notice of loss. Its transaction is regulatory data lodgement,
      and that is portal-only.
  auth:
    model: SAML/OIDC-style federated human SSO to a partner portal — Australian Government
      Digital ID System (myID) for identity plus Relationship Authorisation Manager
      (RAM) for the entity relationship
    apiAuth: none — no API key, OAuth2 client-credentials, OAuth2 authorization-code
      or mTLS API scheme is published
    wellKnown:
    - url: https://www.apra.gov.au/.well-known/openid-configuration
      status: 404
    - url: https://connect.apra.gov.au/.well-known/openid-configuration
      status: 200
      parsed: false
      note: FALSE POSITIVE — WAF rejection HTML, not OIDC discovery metadata.
    - url: https://connect.apra.gov.au/.well-known/oauth-authorization-server
      status: 200
      parsed: false
      note: FALSE POSITIVE — WAF rejection HTML.
  webhooks:
    present: false
    asyncapi: false
    note: No event catalog, webhook documentation or AsyncAPI definition. The only
      push mechanism APRA operates is an RSS 2.0 news feed at https://www.apra.gov.au/rss.xml
      (confirmed HTTP 200, valid RSS 2.0 with dc namespace), which is a publications
      feed, not an event API.
  postman:
    present: false
    note: No public Postman collection or workspace found.
  graphql:
    present: false
    note: No /graphql surface.
  grpc:
    present: false
  openData:
    dataGovAu: false
    note: CKAN package_search against data.gov.au for organization:australian-prudential-regulation-authority
      returned count 0, and organization_show returned the site 404 page. APRA does
      not publish through the national open data portal.
  transports:
  - protocol: HTTPS (browser)
    scheme: https
    baseURL: https://connect.apra.gov.au
    documented: true
    note: APRA Connect production lodgement portal. Human browser access only, behind
      myID + RAM. Anonymous requests are rejected by an F5 WAF.
  - protocol: HTTPS (browser)
    scheme: https
    baseURL: https://connect-test.apra.gov.au
    documented: true
    note: APRA Connect test environment; RegTech access by signed deed only.
  - protocol: File transfer (XML / XBRL / Excel upload)
    scheme: https
    documented: true
    note: Submission formats are manual entry, XML, XBRL and Excel, uploaded through
      the portal. 30 MB maximum for ad hoc uploads. This is the real integration
      transport in place of an API.
  - protocol: RSS
    scheme: https
    baseURL: https://www.apra.gov.au/rss.xml
    documented: true
    note: RSS 2.0 news and publications feed. Confirmed live.
  - protocol: REST
    documented: false
    note: No REST API is published. APRA's own technical specifications page lists the
      API Technical Specification as "to be provided when this functionality is
      available."
  - protocol: SOAP
    documented: false
  - protocol: GraphQL
    documented: false
  - protocol: WebSocket
    documented: false
